plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.slimcreative.chatslim'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'br.com.slimcreative.chatslim'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'

        ndk {
            // só as arquiteturas que o Node embarcado (nodejs-mobile) oferece
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libnode.so', '**/libc++_shared.so']
        }
    }
}
