name: Build Chat Slim APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do motor
        run: npm ci

      - name: Empacotar o motor (Baileys + servidor) para o Android
        run: npm run build:motor
        env:
          MOTOR_VERSAO: ${{ github.run_number }}

      - name: Baixar o Node.js para Android (nodejs-mobile 18.20.4)
        run: |
          mkdir -p /tmp/nodejs-mobile
          cd /tmp/nodejs-mobile
          npm pack nodejs-mobile-react-native@18.20.4
          tar xzf nodejs-mobile-react-native-18.20.4.tgz package/android/libnode
          mkdir -p "$GITHUB_WORKSPACE/android/app/libnode"
          cp -r package/android/libnode/bin package/android/libnode/include "$GITHUB_WORKSPACE/android/app/libnode/"
          ls -la "$GITHUB_WORKSPACE/android/app/libnode/bin/"*

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Dar permissão de execução ao gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChatSlim.apk

      - name: Enviar APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: ChatSlim-apk
          path: ChatSlim.apk
          retention-days: 30

      - name: Guardar APK no branch "apk" (para baixar direto)
        run: |
          mkdir /tmp/apk-branch && cp ChatSlim.apk /tmp/apk-branch/
          cd /tmp/apk-branch
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ChatSlim.apk
          git commit -q -m "APK de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Publicar o motor pra atualização automática (branch "motor")
        run: |
          mkdir /tmp/motor-branch && cp -r android/app/src/main/assets/nodejs-project/. /tmp/motor-branch/
          cd /tmp/motor-branch
          git init -q -b motor
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Motor ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" motor
