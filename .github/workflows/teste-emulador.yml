name: Teste no emulador Android

on:
  workflow_dispatch: {}

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build:motor

      - name: Baixar o Node.js para Android (nodejs-mobile 18.20.4)
        run: |
          mkdir -p /tmp/nodejs-mobile && cd /tmp/nodejs-mobile
          npm pack nodejs-mobile-react-native@18.20.4
          tar xzf nodejs-mobile-react-native-18.20.4.tgz package/android/libnode
          mkdir -p "$GITHUB_WORKSPACE/android/app/libnode"
          cp -r package/android/libnode/bin package/android/libnode/include "$GITHUB_WORKSPACE/android/app/libnode/"

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Compilar APK com x86_64 (para o emulador)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug -PincluirX86 --stacktrace

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/teste-emulador.sh

      - name: Enviar print da tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tela-emulador
          path: tela-emulador.png
          if-no-files-found: ignore
